name: CI

on:
  push:
    branches: [ "main", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "main", "feature/**" ]

jobs:
  test:
    name: Smoke Test (Godot Headless)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2 libgl1 libxcursor1 libxinerama1 libxrandr1 libxi6

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false

      - name: Run Smoke Test
        run: |
          ./run.sh --test
